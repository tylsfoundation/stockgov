name: stockgov

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16
    container_name: congress_trades_db
    restart: always
    environment:
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: congress_trades
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d congress_trades"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

